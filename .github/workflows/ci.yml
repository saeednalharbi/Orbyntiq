name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python Quality & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

      ORBYNTIQ_ENVIRONMENT: testing
      ORBYNTIQ_DEBUG: "false"

      ORBYNTIQ_REDIS_URL: redis://127.0.0.1:6379/0
      ORBYNTIQ_MONGODB_URL: mongodb://127.0.0.1:27017
      ORBYNTIQ_QDRANT_URL: http://127.0.0.1:6333

      ORBYNTIQ_OTEL_EXPORTER_ENABLED: "false"

    services:
      redis:
        image: redis:8.10.1-alpine
        ports:
          - 6379:6379

      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017

      qdrant:
        image: qdrant/qdrant:v1.19.0
        ports:
          - 6333:6333
          - 6334:6334

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Orbyntiq
        run: python -m pip install -e ".[dev]"

      - name: Verify service dependencies
        shell: bash
        run: |
          python - <<'PY'
          import time

          from pymongo import MongoClient
          from qdrant_client import QdrantClient
          from redis import Redis


          def retry(name, check, attempts=30, delay=1):
              last_error = None

              for attempt in range(1, attempts + 1):
                  try:
                      check()
                      print(f"{name}=OK")
                      return
                  except Exception as exc:
                      last_error = exc
                      print(
                          f"{name} attempt "
                          f"{attempt}/{attempts}: {exc}"
                      )
                      time.sleep(delay)

              raise RuntimeError(
                  f"{name} did not become ready: "
                  f"{last_error}"
              )


          redis_client = Redis.from_url(
              "redis://127.0.0.1:6379/0"
          )

          mongo_client = MongoClient(
              "mongodb://127.0.0.1:27017",
              serverSelectionTimeoutMS=2000,
          )

          qdrant_client = QdrantClient(
              url="http://127.0.0.1:6333",
              timeout=2,
          )

          try:
              retry(
                  "REDIS",
                  lambda: redis_client.ping(),
              )

              retry(
                  "MONGODB",
                  lambda: mongo_client.admin.command("ping"),
              )

              retry(
                  "QDRANT",
                  lambda: qdrant_client.get_collections(),
              )

              print("CI_SERVICES_READY")
          finally:
              redis_client.close()
              mongo_client.close()
              qdrant_client.close()
          PY

      - name: Ruff
        run: python -m ruff check .

      - name: Test suite
        run: python -m pytest

      - name: Validate Docker Compose
        run: docker compose config --quiet