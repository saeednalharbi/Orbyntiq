services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: orbyntiq-api

    ports:
      - "8000:8000"

    environment:
      ORBYNTIQ_API_HOST: "0.0.0.0"
      ORBYNTIQ_API_PORT: "8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 3

  mongodb:
    image: mongo:8.0
    container_name: orbyntiq-mongodb

    ports:
      - "127.0.0.1:27017:27017"

    volumes:
      - mongodb_data:/data/db

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongodb_data:
