name: Security CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pip-audit==2.10.1"

      - name: Audit Python dependencies
        run: |
          python -m pip_audit . --strict
          echo "PIP_AUDIT_OK"

  secret-scan:
    name: Git History Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan repository history with Gitleaks
        shell: bash
        run: |
          docker run \
            --rm \
            -v "$PWD:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect \
            --source=/repo \
            --no-banner \
            --redact \
            --exit-code 1

          echo "GITLEAKS_OK"

  image-scan:
    name: Production Image Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build production image
        run: |
          docker build \
            --tag orbyntiq-api:security-ci \
            .

      - name: Export production image
        run: |
          docker save \
            orbyntiq-api:security-ci \
            --output orbyntiq-security-ci.tar

      - name: Scan HIGH and CRITICAL vulnerabilities
        shell: bash
        run: |
          docker run \
            --rm \
            -v "$PWD:/repo" \
            aquasec/trivy:0.74.0 \
            image \
            --input /repo/orbyntiq-security-ci.tar \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --no-progress

          echo "TRIVY_ZERO_HIGH_CRITICAL_OK"

      - name: Cleanup image archive
        if: always()
        run: |
          rm -f orbyntiq-security-ci.tar