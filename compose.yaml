name: orbyntiq

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: orbyntiq-api:local
    container_name: orbyntiq-api
    init: true
    restart: unless-stopped

    environment:
      ORBYNTIQ_ENVIRONMENT: production
      ORBYNTIQ_DEBUG: "false"
      ORBYNTIQ_LOG_LEVEL: INFO

      ORBYNTIQ_API_HOST: 0.0.0.0
      ORBYNTIQ_API_PORT: "8000"

      # Local LLM and embeddings run on the host through Ollama.
      ORBYNTIQ_LLM_PROVIDER: ollama
      ORBYNTIQ_LLM_MODEL: qwen3:4b-instruct
      ORBYNTIQ_OLLAMA_BASE_URL: http://host.docker.internal:11434
      ORBYNTIQ_OLLAMA_KEEP_ALIVE: 10m
      ORBYNTIQ_LLM_MAX_CONCURRENCY: "2"
      ORBYNTIQ_LLM_HTTP_MAX_CONNECTIONS: "4"
      ORBYNTIQ_LLM_HTTP_MAX_KEEPALIVE_CONNECTIONS: "2"
      ORBYNTIQ_LLM_HTTP_KEEPALIVE_EXPIRY_SECONDS: "30"

      ORBYNTIQ_EMBEDDING_PROVIDER: ollama
      ORBYNTIQ_EMBEDDING_MODEL: qwen3-embedding:0.6b
      ORBYNTIQ_EMBEDDING_DIMENSION: "1024"

      # Internal Compose service discovery.
      ORBYNTIQ_REDIS_URL: redis://redis:6379/0
      ORBYNTIQ_MONGODB_URL: mongodb://mongodb:27017
      ORBYNTIQ_QDRANT_URL: http://qdrant:6333

      # Telemetry is exported to the collector over the Compose network.
      ORBYNTIQ_OBSERVABILITY_ENABLED: "true"
      ORBYNTIQ_METRICS_ENABLED: "true"
      ORBYNTIQ_TRACING_ENABLED: "true"
      ORBYNTIQ_OTEL_EXPORTER_ENABLED: "true"
      ORBYNTIQ_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      ORBYNTIQ_OTEL_EXPORTER_OTLP_INSECURE: "true"

    ports:
      - "127.0.0.1:8000:8000"

    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      otel-collector:
        condition: service_started

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s

    networks:
      - orbyntiq

  redis:
    image: redis:8.10.1-alpine
    container_name: orbyntiq-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
      - "[::1]:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - orbyntiq

  mongodb:
    image: mongo:8.0
    container_name: orbyntiq-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - orbyntiq

  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: orbyntiq-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'echo > /dev/tcp/127.0.0.1/6333'",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - orbyntiq

  tempo:
    image: grafana/tempo:3.0.3
    container_name: orbyntiq-tempo
    restart: unless-stopped
    command:
      - "-target=all"
      - "-config.file=/etc/tempo.yaml"
    volumes:
      - ./infra/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"
    networks:
      - orbyntiq

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0
    container_name: orbyntiq-otel-collector
    restart: unless-stopped
    command:
      - "--config=/etc/otelcol-contrib/config.yaml"
    volumes:
      - ./infra/otel/collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133"
    depends_on:
      - tempo
    networks:
      - orbyntiq

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: orbyntiq-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - orbyntiq

  grafana:
    image: grafana/grafana:13.2.0
    container_name: orbyntiq-grafana
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - tempo
    networks:
      - orbyntiq

networks:
  orbyntiq:
    name: orbyntiq-network

volumes:
  redis_data:
  mongodb_data:
  qdrant_data:
  tempo_data:
  prometheus_data:
  grafana_data:
