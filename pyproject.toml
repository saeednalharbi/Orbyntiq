[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbyntiq"
version = "0.1.0"
description = "Enterprise-style multi-agent AI platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "opentelemetry-api>=1.44.0,<1.45.0",
    "opentelemetry-sdk>=1.44.0,<1.45.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.44.0,<1.45.0",
    "prometheus-client>=0.26.0,<0.27.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "pydantic-settings>=2.0,<3.0",
    "pymongo>=4.13,<5.0",
    "pypdf>=5.0,<7.0",
    "qdrant-client==1.19.0",
    "redis>=5.0,<7.0",
    "mcp[cli]==2.1.1",
    "langgraph>=1.2,<1.3",
    "uvicorn[standard]>=0.30,<1.0"
]

[project.optional-dependencies]
dev = [
    "locust>=2.46,<2.47",
    "psutil>=7.0,<8.0",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.6",
    "websocket-client>=1.9,<2.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra -p no:locust"

[tool.coverage.run]
source = ["orbyntiq"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
