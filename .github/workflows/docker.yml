name: Container CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    name: Production Image & Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      redis:
        image: redis:8.10.1-alpine
        ports:
          - 6379:6379

      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017

      qdrant:
        image: qdrant/qdrant:v1.19.0
        ports:
          - 6333:6333
          - 6334:6334

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build production image
        run: |
          docker build \
            --tag orbyntiq-api:ci \
            .

      - name: Inspect production image
        shell: bash
        run: |
          echo "===== IMAGE ====="

          docker image inspect orbyntiq-api:ci \
            --format \
            'User={{.Config.User}} Size={{.Size}} Cmd={{json .Config.Cmd}}'

          echo "===== HEALTHCHECK ====="

          docker image inspect orbyntiq-api:ci \
            --format \
            '{{json .Config.Healthcheck}}'

          USER_VALUE="$(
            docker image inspect orbyntiq-api:ci \
              --format '{{.Config.User}}'
          )"

          if [ "$USER_VALUE" != "orbyntiq" ]; then
            echo "Expected image user 'orbyntiq'."
            echo "Actual: $USER_VALUE"
            exit 1
          fi

          echo "NON_ROOT_IMAGE_USER_OK"

      - name: Verify runtime identity
        run: |
          docker run \
            --rm \
            --entrypoint python \
            orbyntiq-api:ci \
            -c \
            "import os; assert os.getuid() == 10001; assert os.getgid() == 10001; print('uid=10001 gid=10001'); print('NON_ROOT_RUNTIME_OK')"

      - name: Verify package installation
        run: |
          docker run \
            --rm \
            --entrypoint python \
            orbyntiq-api:ci \
            -c \
            "import orbyntiq; print(orbyntiq.__file__); print('ORBYNTIQ_IMPORT_OK')"

      - name: Verify Uvicorn
        run: |
          docker run \
            --rm \
            --entrypoint uvicorn \
            orbyntiq-api:ci \
            --version

      - name: Verify infrastructure readiness
        shell: bash
        run: |
          python - <<'PY'
          import socket
          import time


          targets = [
              ("127.0.0.1", 6379, "REDIS"),
              ("127.0.0.1", 27017, "MONGODB"),
              ("127.0.0.1", 6333, "QDRANT"),
          ]


          for host, port, name in targets:
              last_error = None

              for attempt in range(1, 31):
                  try:
                      with socket.create_connection(
                          (host, port),
                          timeout=2,
                      ):
                          print(f"{name}=OK")
                          break
                  except OSError as exc:
                      last_error = exc
                      print(
                          f"{name} attempt "
                          f"{attempt}/30: {exc}"
                      )
                      time.sleep(1)
              else:
                  raise RuntimeError(
                      f"{name} did not become ready: "
                      f"{last_error}"
                  )

          print("CONTAINER_CI_SERVICES_READY")
          PY

      - name: Start production API container
        shell: bash
        run: |
          docker run \
            --detach \
            --name orbyntiq-api-ci \
            --network host \
            --read-only \
            --tmpfs /tmp \
            --security-opt no-new-privileges:true \
            --cap-drop ALL \
            --env ORBYNTIQ_ENVIRONMENT=testing \
            --env ORBYNTIQ_DEBUG=false \
            --env ORBYNTIQ_REDIS_URL=redis://127.0.0.1:6379/0 \
            --env ORBYNTIQ_MONGODB_URL=mongodb://127.0.0.1:27017 \
            --env ORBYNTIQ_QDRANT_URL=http://127.0.0.1:6333 \
            --env ORBYNTIQ_OBSERVABILITY_ENABLED=false \
            --env ORBYNTIQ_OTEL_EXPORTER_ENABLED=false \
            orbyntiq-api:ci

          docker ps --filter name=orbyntiq-api-ci

      - name: Wait for API health
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            if RESPONSE="$(
              curl \
                --silent \
                --show-error \
                --fail \
                http://127.0.0.1:8000/health \
                2>/dev/null
            )"; then
              echo "$RESPONSE"

              echo "$RESPONSE" |
                grep '"status":"healthy"' >/dev/null

              echo "$RESPONSE" |
                grep '"environment":"testing"' >/dev/null

              echo "CONTAINER_API_HEALTH_OK"
              exit 0
            fi

            echo "Health attempt $attempt/30"
            sleep 2
          done

          echo "API failed to become healthy."
          docker logs orbyntiq-api-ci
          exit 1

      - name: Verify hardened runtime
        shell: bash
        run: |
          docker inspect orbyntiq-api-ci \
            --format \
            'User={{.Config.User}} ReadOnly={{.HostConfig.ReadonlyRootfs}} CapDrop={{json .HostConfig.CapDrop}} SecurityOpt={{json .HostConfig.SecurityOpt}}'

          READ_ONLY="$(
            docker inspect orbyntiq-api-ci \
              --format '{{.HostConfig.ReadonlyRootfs}}'
          )"

          if [ "$READ_ONLY" != "true" ]; then
            echo "Container root filesystem is not read-only."
            exit 1
          fi

          RUNNING="$(
            docker inspect orbyntiq-api-ci \
              --format '{{.State.Running}}'
          )"

          if [ "$RUNNING" != "true" ]; then
            echo "Container stopped unexpectedly."
            docker logs orbyntiq-api-ci
            exit 1
          fi

          echo "HARDENED_RUNTIME_OK"

      - name: Container logs
        if: always()
        run: |
          docker logs orbyntiq-api-ci || true

      - name: Cleanup
        if: always()
        run: |
          docker rm \
            --force \
            orbyntiq-api-ci \
            2>/dev/null || true